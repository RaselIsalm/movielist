name: Flutter web build and deploy

on:
  push:
    branches: [main]
    paths:
      - 'DTLive v2/**/Mainfiles_DTLive/Appcode/yourappname/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          cache: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Create CI build configuration
        env:
          DTLIVE_BASE_URL: ${{ secrets.DTLIVE_BASE_URL }}
          DTLIVE_API_TOKEN: ${{ secrets.DTLIVE_API_TOKEN }}
          DTLIVE_WEB_DOMAIN_URL: ${{ secrets.DTLIVE_WEB_DOMAIN_URL }}
        run: |
          if [ -z "$DTLIVE_BASE_URL" ] || [ -z "$DTLIVE_API_TOKEN" ] || [ -z "$DTLIVE_WEB_DOMAIN_URL" ]; then
            echo "Set DTLIVE_BASE_URL, DTLIVE_API_TOKEN, and DTLIVE_WEB_DOMAIN_URL in repository Actions secrets." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ['RUNNER_TEMP']) / 'dtlive-build.json'
          token = os.environ['DTLIVE_API_TOKEN'].strip()
          if len(token) >= 2 and token[0] == token[-1] and token[0] in "'\"":
              token = token[1:-1].strip()
          output.write_text(json.dumps({
              'DTLIVE_BASE_URL': os.environ['DTLIVE_BASE_URL'],
              'DTLIVE_API_TOKEN': token,
              'DTLIVE_WEB_DOMAIN_URL': os.environ['DTLIVE_WEB_DOMAIN_URL'],
          }))
          print(output)
          PY

      - name: Build Flutter web release
        env:
          CONFIG_FILE: ${{ runner.temp }}/dtlive-build.json
          DTLIVE_WEB_DOMAIN_URL: ${{ secrets.DTLIVE_WEB_DOMAIN_URL }}
        run: |
          APP_DIR="$(find "DTLive v2" -type d -path '*/Mainfiles_DTLive/Appcode/yourappname' -print -quit)"
          if [ -z "$APP_DIR" ]; then
            echo "Flutter app directory was not found." >&2
            exit 1
          fi
          cd "$APP_DIR"
          flutter pub get
          # A custom domain such as linkviral.seedintrade.com is served from
          # the origin root. GitHub's default project URL needs the repository
          # subpath instead.
          case "$DTLIVE_WEB_DOMAIN_URL" in
            *github.io/*) BASE_HREF="/${GITHUB_REPOSITORY#*/}/" ;;
            *) BASE_HREF="/" ;;
          esac
          flutter build web --release --no-wasm-dry-run --base-href "$BASE_HREF" --dart-define-from-file="$CONFIG_FILE"
          # Static assets are cached by the production edge. Version both the
          # bootstrap entrypoint and Dart bundle so a new release is fetched
          # immediately instead of waiting for the old main.dart.js TTL.
          python3 - "$APP_DIR/build/web/index.html" "$APP_DIR/build/web/flutter_bootstrap.js" "$GITHUB_SHA" <<'PY'
          import sys
          from pathlib import Path

          index_path = Path(sys.argv[1])
          bootstrap_path = Path(sys.argv[2])
          version = sys.argv[3][:12]

          index = index_path.read_text()
          index = index.replace(
              'src="flutter_bootstrap.js"',
              f'src="flutter_bootstrap.js?v={version}"',
          )
          index_path.write_text(index)

          bootstrap = bootstrap_path.read_text()
          bootstrap = bootstrap.replace(
              '"mainJsPath":"main.dart.js"',
              f'"mainJsPath":"main.dart.js?v={version}"',
          )
          bootstrap_path.write_text(bootstrap)
          PY
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIR }}/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
