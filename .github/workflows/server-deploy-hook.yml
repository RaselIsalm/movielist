name: Trigger Laravel deployment

on:
  push:
    branches: [main]
    paths:
      - 'DTLive v2/**/Mainfiles_DTLive/ServerCode/admin_panel/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger hosting provider deploy hook
        if: ${{ env.DEPLOY_HOOK_URL != '' }}
        run: curl --fail --show-error --silent --retry 3 -X POST "$DEPLOY_HOOK_URL"

      - name: Explain skipped deployment
        if: ${{ env.DEPLOY_HOOK_URL == '' }}
        run: echo "Set the DEPLOY_HOOK_URL Actions secret to enable automatic Laravel deployment."
